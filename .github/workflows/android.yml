name: Android

# Debug APK on every push; signed release AAB + APK only when the four signing
# secrets exist. `android/` is generated by `npx cap add android` (Capacitor 8);
# until it is committed the workflow prints a notice and exits successfully.
#
# Action tags verified with `git ls-remote --tags` on 2026-09-29:
#   actions/checkout v7, actions/setup-node v7, actions/setup-java v6,
#   gradle/actions v6 (setup-gradle), actions/upload-artifact v7.

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      has_android: ${{ steps.detect.outputs.has_android }}
      has_secrets: ${{ steps.detect.outputs.has_secrets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `secrets` cannot be used in a job-level `if:`, so compute booleans here and
      # expose them as job outputs for the `release` job.
      - name: Detect android/ directory and signing secrets
        id: detect
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -d android ] && [ -f android/gradlew ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
            chmod +x android/gradlew
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
            echo "::notice::android/ (with gradlew) does not exist yet - run 'npx cap add android' and commit it. Skipping the Android build."
          fi
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present: the release job will run."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing: only the debug APK will be built."
          fi
          exit 0

      - name: Setup Node 22
        if: steps.detect.outputs.has_android == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21 (Temurin)
        if: steps.detect.outputs.has_android == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: steps.detect.outputs.has_android == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build web assets and sync Capacitor
        if: steps.detect.outputs.has_android == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble debug APK
        if: steps.detect.outputs.has_android == 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: steps.detect.outputs.has_android == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lot-and-roll-debug-apk
          path: android/app/build/outputs/apk/debug/LotAndRoll-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed release (AAB + APK)
    needs: debug
    if: needs.debug.outputs.has_android == 'true' && needs.debug.outputs.has_secrets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build web assets and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      # storeFile is resolved relative to android/app (see docs/RELEASE.md build.gradle snippet).
      - name: Decode keystore and write keystore.properties
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          {
            printf 'storeFile=%s\n' 'release.keystore'
            printf 'storePassword=%s\n' "$KS_PASS"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASS"
          } > android/keystore.properties
          chmod 600 android/app/release.keystore android/keystore.properties
          chmod +x android/gradlew

      - name: Build signed AAB and APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: lot-and-roll-release-apk
          path: android/app/build/outputs/apk/release/LotAndRoll-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.keystore android/keystore.properties
