name: CI

# Typecheck, unit tests, production build and Playwright e2e.
# Action tags verified with `git ls-remote --tags` on 2026-09-29:
#   actions/checkout v7, actions/setup-node v7, actions/upload-artifact v7.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck / test / build / e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      # e2e is informational: a screenshot diff or a flaky browser must never block a merge.
      - name: Install Playwright Chromium
        id: pw-install
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        id: e2e
        if: steps.pw-install.outcome == 'success'
        continue-on-error: true
        run: |
          if grep -q '"e2e"' package.json; then
            npm run e2e
          else
            npx playwright test
          fi

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize e2e result
        if: always()
        run: |
          echo "e2e outcome: ${{ steps.e2e.outcome || 'skipped' }} (non-blocking)" | tee -a "$GITHUB_STEP_SUMMARY"
