apply plugin: 'com.android.application'

// Release signing: android/keystore.properties (git-ignored, see docs/RELEASE.md 3.1) is optional.
// Without it `assembleRelease` / `bundleRelease` still work but produce UNSIGNED output.
def keystorePropertiesFile = rootProject.file("keystore.properties")   // android/keystore.properties
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.bigssu.lotandroll"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.bigssu.lotandroll"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        buildConfigField "boolean", "SOFTWARE_WEBVIEW", (project.findProperty("softwareWebView") == "true").toString()
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile     file(keystoreProperties['storeFile'])   // relative to android/app
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "MoneyPoly-${variant.buildType.name}.apk"
        }
        // Optional, per machine: copy every built APK to a folder named by the Gradle property
        // `moneyPolyApkCopyDir` (the older `landPolyApkCopyDir` still works; set it in ~/.gradle/gradle.properties; never committed). The copy is
        // named by version and build time (MoneyPoly-0.1.0-20261005-1421-debug.apk) so builds in that
        // folder can be told apart; the Gradle output keeps its fixed name for scripts and CI.
        def copyDir = project.findProperty('moneyPolyApkCopyDir') ?: project.findProperty('landPolyApkCopyDir')
        if (copyDir) {
            variant.assembleProvider.configure { task ->
                task.doLast {
                    variant.outputs.collect { it.outputFile }.each { apk ->
                        // The APK's own time, so re-running an up-to-date build does not add a duplicate.
                        def stamp = new java.text.SimpleDateFormat('yyyyMMdd-HHmm').format(new Date(apk.lastModified()))
                        def name = apk.name.replaceFirst(/^MoneyPoly-/, "MoneyPoly-${variant.versionName}-${stamp}-")
                        project.copy {
                            from(apk)
                            into(copyDir)
                            rename { name }
                        }
                        logger.lifecycle("APK copied to ${copyDir}/${name}")
                    }
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
