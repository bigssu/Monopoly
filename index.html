    <style>
      /* Boot splash: pure CSS, removed by main.ts once the first screen is mounted. */
      html, body { margin: 0; height: 100%; background: #16202D; }
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 40%, #2A3A50 0%, #1E2A3A 45%, #121A25 100%);
        transition: opacity 360ms cubic-bezier(.22, 1, .36, 1), visibility 0s linear 360ms;
      }
      #splash .splash-logo {
        width: min(34vmin, 180px); aspect-ratio: 1;
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .45));
        animation: splash-pop 700ms cubic-bezier(.34, 1.56, .64, 1) both, splash-float 2.4s 700ms ease-in-out infinite;
      }
      #splash .splash-logo svg { width: 100%; height: 100%; display: block; }
      #splash .splash-dots { position: absolute; bottom: 14vh; display: flex; gap: 10px; }
      #splash .splash-dots i {
        width: 10px; height: 10px; border-radius: 50%; background: #F2B633; opacity: .25;
        animation: splash-dot 1s ease-in-out infinite;
      }
      #splash .splash-dots i:nth-child(2) { animation-delay: .15s; }
      #splash .splash-dots i:nth-child(3) { animation-delay: .3s; }
      #splash.is-hidden { opacity: 0; visibility: hidden; }
      @keyframes splash-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splash-float { 50% { transform: translateY(-8px); } }
      @keyframes splash-dot { 50% { opacity: 1; transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
